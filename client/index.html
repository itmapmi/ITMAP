<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />

    <title>itmap.ai — Enterprise IT Vendor Intelligence | See Every Vendor. Know Every Move.</title>
    <meta
      name="description"
      content="itmap.ai is the AI-native enterprise IT vendor intelligence platform. Independent vendor rankings, feature evaluations, market forecasts, news impact analysis, and research reports for technology buyers."
    />
    <meta
      name="keywords"
      content="enterprise IT vendor intelligence, vendor evaluation, technology vendor ranking, market research, AI market forecasting, magic quadrant alternative, IT analyst platform, software vendor analysis, competitive intelligence, vendor selection"
    />
    <meta name="author" content="itmap.ai" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://itmap.ai/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="itmap.ai" />
    <meta property="og:url" content="https://itmap.ai/" />
    <meta property="og:title" content="itmap.ai — Enterprise IT Vendor Intelligence" />
    <meta
      property="og:description"
      content="Independent, AI-powered enterprise IT vendor intelligence — vendor rankings, feature evaluations, market forecasts, and research reports."
    />
    <meta property="og:image" content="https://itmap.ai/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="itmap.ai — Enterprise IT Vendor Intelligence" />
    <meta
      name="twitter:description"
      content="Independent, AI-powered enterprise IT vendor intelligence — vendor rankings, feature evaluations, market forecasts, and research reports."
    />
    <meta name="twitter:image" content="https://itmap.ai/og-image.png" />

    <!-- Favicons (white ITMAP wordmark on black background) -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance / fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: Organization + WebSite + SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://itmap.ai/#organization",
            "name": "itmap.ai",
            "alternateName": "Spectio",
            "url": "https://itmap.ai/",
            "logo": "https://itmap.ai/logo.jpg",
            "description": "AI-native enterprise IT vendor intelligence platform delivering independent vendor rankings, feature evaluations, market forecasts, and research reports.",
            "slogan": "See Every Vendor. Know Every Move.",
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://itmap.ai/#website",
            "url": "https://itmap.ai/",
            "name": "itmap.ai",
            "publisher": { "@id": "https://itmap.ai/#organization" },
            "inLanguage": "en-US",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://itmap.ai/markets?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "itmap.ai",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Enterprise IT vendor intelligence and AI-native market forecasting platform.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      itmap.ai is the AI-native enterprise IT vendor intelligence platform —
      independent vendor rankings, feature evaluations, market forecasts, and
      research reports. Please enable JavaScript to use the application.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
